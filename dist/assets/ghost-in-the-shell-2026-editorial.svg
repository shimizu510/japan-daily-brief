<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Ghost in the Shell editorial timeline</title><desc id="d">Editorial timeline connecting the 1989 manga, 1995 film, and 2026 new production announcement.</desc><rect width="1200" height="800" fill="#080f26"/><g fill="none" stroke="#76d6c5" stroke-width="4"><path d="M90 420H1110"/><circle cx="180" cy="420" r="22"/><circle cx="560" cy="420" r="22"/><circle cx="1000" cy="420" r="22"/></g><g fill="#f6f2e9" font-family="Arial"><text x="72" y="92" font-size="24" letter-spacing="5">EDITORIAL TIMELINE · NOT OFFICIAL ARTWORK</text><text x="72" y="210" font-family="Georgia" font-size="76">A ghost keeps changing shells.</text><g font-size="62" font-weight="800"><text x="125" y="355">1989</text><text x="505" y="355">1995</text><text x="945" y="355">2026</text></g><g font-size="24"><text x="110" y="490">Shirow Masamune’s</text><text x="110" y="525">manga begins</text><text x="475" y="490">Mamoru Oshii’s film</text><text x="475" y="525">reframes animation</text><text x="885" y="490">A new production</text><text x="885" y="525">is announced</text></g><text x="72" y="710" font-family="Georgia" font-size="28" fill="#c9a34b">See the actual work in the official trailer embedded in the story.</text></g></svg>
