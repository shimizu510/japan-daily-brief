<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Japan Weeks 2026 editorial schedule</title><desc id="desc">Five-day schedule graphic showing finance, climate, talent, governance and international investment themes.</desc><rect width="1200" height="800" fill="#142019"/><text x="70" y="125" fill="#f6f2e9" font-family="Georgia,serif" font-size="82">Japan opens a five-day</text><text x="70" y="210" fill="#d7b65d" font-family="Georgia,serif" font-size="82">window for capital.</text><g font-family="Arial,sans-serif"><text x="72" y="305" fill="#aebbb4" font-size="22">OCTOBER 26–30 · CORE WEEK</text><g transform="translate(70 360)"><rect width="200" height="250" fill="#f6f2e9"/><rect x="215" width="200" height="250" fill="#e8e1d2"/><rect x="430" width="200" height="250" fill="#f6f2e9"/><rect x="645" width="200" height="250" fill="#e8e1d2"/><rect x="860" width="200" height="250" fill="#f6f2e9"/><g fill="#9c2e2e" font-size="24" font-weight="700"><text x="25" y="48">MON 26</text><text x="240" y="48">TUE 27</text><text x="455" y="48">WED 28</text><text x="670" y="48">THU 29</text><text x="885" y="48">FRI 30</text></g><g fill="#142019" font-size="21"><text x="25" y="100">Climate</text><text x="25" y="132">Talent</text><text x="25" y="164">Markets</text><text x="240" y="100">Governance</text><text x="240" y="132">Assets</text><text x="455" y="100">Transition</text><text x="455" y="132">Finance</text><text x="670" y="100">Investment</text><text x="670" y="132">Dialogue</text><text x="885" y="100">Energy</text><text x="885" y="132">Security</text></g></g><text x="70" y="710" fill="#aebbb4" font-size="18">JAPAN DAILY BRIEF · EDITORIAL GRAPHIC BASED ON THE FSA PROGRAM · NOT AN OFFICIAL POSTER</text></g></svg>
