<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Hasami ware and 32 short episodes</title><desc id="desc">Editorial graphic of a blue painted bowl and the number 32 for the NHK drama set in Hasami.</desc><rect width="1200" height="800" fill="#ece7dd"/><circle cx="390" cy="410" r="250" fill="#f9f6ef" stroke="#284d6c" stroke-width="18"/><path d="M210 360 Q390 250 570 360 M190 430 Q390 320 590 430 M230 500 Q390 420 550 500" fill="none" stroke="#3d789f" stroke-width="22"/><text x="730" y="310" fill="#9c2e2e" font-family="Georgia,serif" font-size="190">32</text><text x="730" y="370" fill="#142019" font-family="Arial,sans-serif" font-size="30" font-weight="700">15-MINUTE EPISODES</text><text x="730" y="455" fill="#142019" font-family="Georgia,serif" font-size="54">A love story</text><text x="730" y="515" fill="#284d6c" font-family="Georgia,serif" font-size="54">painted in clay.</text><text x="70" y="735" fill="#6d6a64" font-family="Arial,sans-serif" font-size="18">JAPAN DAILY BRIEF · ORIGINAL EDITORIAL ARTWORK · NOT NHK OR MANGA CHARACTER ART</text></svg>
