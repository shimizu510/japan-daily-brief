<g font-family="Arial,Helvetica,sans-serif"><g transform="translate(72 350)"><text fill="#e8c76f" font-family="Georgia,serif" font-size="92">1,085</text><text y="42" x="300" fill="#fff" font-size="22" font-weight="700">POLLING PLACES</text></g><g transform="translate(72 495)"><text fill="#e8c76f" font-family="Georgia,serif" font-size="92">47</text><text y="42" x="185" fill="#fff" font-size="22" font-weight="700">KORIYAMA SITES WITH BELLS + FIRECRACKERS</text></g><g transform="translate(72 640)"><text fill="#e8c76f" font-family="Georgia,serif" font-size="92">883</text><text y="28" x="235" fill="#fff" font-size="20" font-weight="700">SIGHTINGS · 8 INJURY INCIDENTS</text><text y="58" x="235" fill="#b9c4bd" font-size="16">KFB figures published October 22</text></g></g>
