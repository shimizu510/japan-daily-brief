<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Japan's population, two directions</title><desc id="d">An editorial data graphic showing Japan's total population down 530,000 year on year, Japanese population down 855,000 and foreign population up 325,000.</desc><rect width="1200" height="800" fill="#142019"/><text x="70" y="82" fill="#e8c76f" font-family="Arial" font-size="24" font-weight="700" letter-spacing="4">JAPAN · LATEST POPULATION ESTIMATE</text><text x="70" y="198" fill="#fff" font-family="Georgia" font-size="76">One country.</text><text x="70" y="282" fill="#fff" font-family="Georgia" font-size="76">Two directions.</text><line x1="70" y1="340" x2="1130" y2="340" stroke="#617168"/><text x="70" y="440" fill="#f6f2e9" font-family="Arial" font-size="27">TOTAL POPULATION</text><text x="1130" y="440" fill="#ef6b60" font-family="Georgia" font-size="72" text-anchor="end">−530,000</text><text x="70" y="557" fill="#f6f2e9" font-family="Arial" font-size="27">JAPANESE POPULATION</text><text x="1130" y="557" fill="#ef6b60" font-family="Georgia" font-size="72" text-anchor="end">−855,000</text><text x="70" y="674" fill="#f6f2e9" font-family="Arial" font-size="27">FOREIGN POPULATION</text><text x="1130" y="674" fill="#e8c76f" font-family="Georgia" font-size="72" text-anchor="end">+325,000</text><text x="70" y="748" fill="#9eaaa3" font-family="Arial" font-size="18">Year-on-year change · Japanese and foreign figures: May 1, 2026 final estimate</text></svg>
