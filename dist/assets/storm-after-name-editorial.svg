<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">The name disappeared. The rain did not.</title><desc id="desc">Editorial weather graphic showing former Typhoon 30 feeding moisture into a stationary front and forecast rainfall through October 26.</desc>
<rect width="1200" height="800" fill="#081b2b"/><path d="M0 410 C240 330 390 470 610 380 S960 280 1200 360" fill="none" stroke="#f2d25d" stroke-width="18" stroke-dasharray="18 16"/><g fill="#58b9dc" opacity=".8"><circle cx="160" cy="300" r="110"/><circle cx="270" cy="330" r="86"/><circle cx="1020" cy="470" r="105"/></g><path d="M190 600 C360 500 500 510 660 425" fill="none" stroke="#f6f2e9" stroke-width="10" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f6f2e9"/></marker></defs><text x="70" y="100" fill="#f6f2e9" font-family="Georgia,serif" font-size="72">The name disappeared.</text><text x="70" y="180" fill="#f2d25d" font-family="Georgia,serif" font-size="72">The rain did not.</text><text x="70" y="690" fill="#f6f2e9" font-family="Arial,sans-serif" font-size="28">Former Typhoon 30 → warm, wet air → stationary front</text><text x="810" y="600" fill="#f2d25d" font-family="Arial,sans-serif" font-size="72" font-weight="700">250 mm</text><text x="812" y="640" fill="#f6f2e9" font-family="Arial,sans-serif" font-size="22">Shikoku forecast maximum</text><text x="70" y="755" fill="#9eb8c5" font-family="Arial,sans-serif" font-size="18">JAPAN DAILY BRIEF · EDITORIAL GRAPHIC · JMA FORECAST AT 16:48 JST, OCT. 25</text></svg>
